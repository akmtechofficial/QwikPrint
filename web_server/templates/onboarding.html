{% extends "base.html" %}

{% block title %}Complete Shop Setup - QwikPrint{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 64px auto; padding: 0 24px;">
    <div class="qp-card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <span class="qp-badge qp-badge-blue" style="margin-bottom: 12px;">
                <svg class="qp-icon text-blue" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                Google Account Verified
            </span>
            <h1 style="font-size: 24px; font-weight: 700; color: var(--qp-fg); margin-top: 8px;">
                Complete Your Shop Setup
            </h1>
            <p style="color: var(--qp-fg-muted); font-size: 14px; margin-top: 6px; line-height: 1.5;">
                Enter your shop details to activate your counter portal.
            </p>
        </div>

        {% if error %}
        <div style="background: var(--qp-danger-subtle); border: 1px solid rgba(220, 38, 38, 0.2); color: var(--qp-danger); padding: 12px; border-radius: var(--qp-radius-md); font-size: 13px; margin-bottom: 20px; line-height: 1.5;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/onboarding" method="POST">
            <input type="hidden" name="email" value="{{ google_email }}">
            <input type="hidden" name="device_fp" value="{{ device_fp }}">

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 13px; font-weight: 500; color: var(--qp-fg-muted); margin-bottom: 6px;">Verified Google Email</label>
                <input type="email" class="qp-input" value="{{ google_email }}" disabled style="background: #F8FAFC; color: var(--qp-fg-muted); cursor: not-allowed;">
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 13px; font-weight: 500; color: var(--qp-fg); margin-bottom: 6px;">Shopkeeper Full Name <span style="color: var(--qp-danger);">*</span></label>
                <input type="text" name="full_name" class="qp-input" placeholder="Enter your full name..." value="{{ google_name }}" required>
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 13px; font-weight: 500; color: var(--qp-fg); margin-bottom: 6px;">Print Shop Name <span style="color: var(--qp-danger);">*</span></label>
                <input type="text" name="shop_name" class="qp-input" placeholder="e.g. Speed Print & Photocopy Hub" value="" required autofocus>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 13px; font-weight: 500; color: var(--qp-fg); margin-bottom: 6px;">Mobile / WhatsApp Number <span style="color: var(--qp-danger);">*</span></label>
                <input type="tel" name="phone" class="qp-input" placeholder="e.g. +91 9876543210" value="" required>
            </div>

            <button type="submit" class="qp-btn qp-btn-primary" style="width: 100%; justify-content: center; font-size: 14px; font-weight: 600;">
                Next: Select Plan →
            </button>
        </form>
    </div>
</div>
{% endblock %}
