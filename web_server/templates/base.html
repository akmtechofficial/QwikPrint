<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QwikPrint{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <a href="/" class="brand-logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <img src="/static/images/qwikprint_logo.png" alt="QwikPrint Logo" style="height: 34px; width: 34px; border-radius: 8px; box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);">
            <span style="font-weight: 800; font-size: 1.25rem; background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">QwikPrint</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/pricing" class="nav-link">Pricing & Plans</a>
            {% if shop %}
            <a href="/subscription" class="nav-link">Subscription</a>
            <a href="/dashboard" class="nav-link" style="background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); padding: 6px 14px; border-radius: 8px; color: var(--primary-light);">📊 Dashboard</a>
            <a href="/logout" class="nav-link" style="color: var(--rose-danger);">Logout</a>
            {% else %}
            <a href="/login" class="nav-link">Login</a>
            <a href="/register" class="nav-link" style="background: linear-gradient(135deg, #0284c7, #2563eb); padding: 6px 16px; border-radius: 8px; color: #ffffff; font-weight: 700;">🚀 Register Shop</a>
            {% endif %}
        </nav>
    </header>

    <main class="app-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Professional SaaS Footer -->
    <footer style="width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); padding: 36px 20px 24px; margin-top: auto;">
        <div style="max-width: 1050px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="/static/images/qwikprint_logo.png" alt="QwikPrint" style="height: 28px; width: 28px; border-radius: 6px;">
                <span style="font-weight: 800; font-size: 1.1rem; color: #ffffff;">QwikPrint</span>
                <span style="color: #64748b; font-size: 0.85rem;">© 2026. Automated Print Counter SaaS.</span>
            </div>

            <div style="display: flex; gap: 20px; font-size: 0.9rem;">
                <a href="/" style="color: #94a3b8; text-decoration: none; font-weight: 500;">Home</a>
                <a href="/pricing" style="color: #94a3b8; text-decoration: none; font-weight: 500;">Pricing</a>
                <a href="/login" style="color: #94a3b8; text-decoration: none; font-weight: 500;">Shopkeeper Login</a>
                <a href="/register" style="color: #38bdf8; text-decoration: none; font-weight: 600;">Get Started</a>
            </div>
        </div>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Auto loading-spinner state for all form submissions across all pages
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function() {
                const btn = this.querySelector('button[type="submit"], input[type="submit"], .btn-primary, .btn-success');
                if (btn && !btn.classList.contains('no-spin')) {
                    btn.classList.add('btn-loading');
                    btn.style.pointerEvents = 'none';
                }
            });
        });

        // Instant click feedback ripple for interactive elements
        document.querySelectorAll('button, .btn, .select-pill, .nav-link').forEach(el => {
            el.addEventListener('click', function() {
                this.style.transform = 'scale(0.96)';
                setTimeout(() => { this.style.transform = ''; }, 120);
            });
        });
    });
    </script>
</body>
</html>
