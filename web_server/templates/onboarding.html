{% extends "base.html" %}

{% block title %}QwikPrint - Complete Shop Setup{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 40px auto; padding: 0 20px;">
    <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 36px 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        <div style="text-align: center; margin-bottom: 28px;">
            <span class="shadcn-badge" style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; font-size: 13px; padding: 6px 14px; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px;">
                🔐 Google Auth Verified
            </span>
            <h2 style="font-size: 26px; font-weight: 800; color: #0f172a; margin-top: 8px;">Complete Your Shop Setup</h2>
            <p style="color: #64748b; font-size: 14px; margin-top: 6px;">Enter your shop details to complete registration and select your plan.</p>
        </div>

        {% if error %}
        <div class="shadcn-alert shadcn-alert-destructive" style="margin-bottom: 20px; border-radius: 10px;">
            <div style="font-size: 14px; line-height: 1.5;">⚠️ {{ error }}</div>
        </div>
        {% endif %}

        <form action="/onboarding" method="POST">
            <input type="hidden" name="email" value="{{ google_email }}">
            <input type="hidden" name="device_fp" value="{{ device_fp }}">

            <div style="margin-bottom: 20px;">
                <label class="shadcn-label">Verified Google Email</label>
                <input type="email" class="shadcn-input" value="{{ google_email }}" disabled style="background: #f8fafc; color: #64748b; border-color: #cbd5e1; cursor: not-allowed; font-weight: 500;">
            </div>

            <div style="margin-bottom: 20px;">
                <label class="shadcn-label">Shopkeeper Full Name <span style="color: #ef4444;">*</span></label>
                <input type="text" name="full_name" class="shadcn-input" placeholder="Enter your full name..." value="{{ google_name }}" required style="font-size: 15px; height: 44px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label class="shadcn-label">Print Shop Name <span style="color: #ef4444;">*</span></label>
                <input type="text" name="shop_name" class="shadcn-input" placeholder="e.g. Speed Print & Photocopy Hub" value="" required autofocus style="font-size: 15px; height: 44px;">
            </div>

            <div style="margin-bottom: 28px;">
                <label class="shadcn-label">Mobile / WhatsApp Number <span style="color: #ef4444;">*</span></label>
                <input type="tel" name="phone" class="shadcn-input" placeholder="e.g. +91 9876543210" value="" required style="font-size: 15px; height: 44px;">
            </div>

            <button type="submit" class="btn-shop-login" style="width: 100%; justify-content: center; padding: 14px; font-size: 16px; background: linear-gradient(135deg, #0d9488, #0284c7); border-radius: 10px; font-weight: 700; cursor: pointer;">
                Next: Select Plan →
            </button>
        </form>
    </div>
</div>
{% endblock %}
